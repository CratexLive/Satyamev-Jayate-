<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #video-container {
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div data-shaka-player-container id="video-container">
    <video data-shaka-player id="video" autoplay></video>
  </div>
  <script>
    async function init() {
      const video = document.getElementById('video');
      const container = document.getElementById('video-container');
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      try {
        // Parallel fetch from your serverless functions
        const [resMpd, resKey] = await Promise.all([
          fetch('/functions/hm', { headers: { "x-app-verify": "CricXCrateSecure2026" } }),
          fetch('/functions/ok', { headers: { "x-app-verify": "CricXCrateSecure2026" } })
        ]);

        if (!resMpd.ok || !resKey.ok) {
          throw new Error('Failed to fetch stream configuration from secure endpoints.');
        }

        const mpdData = await resMpd.json();
        const keyData = await resKey.json();

        // Configure player with dynamic keys fetched securely from backend
        player.configure({
          drm: {
            clearKeys: keyData.clearKeys || keyData
          }
        });

        // Load dynamic stream URL fetched securely from backend
        await player.load(mpdData.stream_url || mpdData);
      } catch (e) {
        console.error('Error loading video', e);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

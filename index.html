<!DOCTYPE html>  
<html>  
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">  
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>  
  <style>  
    html, body {  
      margin: 0; padding: 0; width: 100%; height: 100%;  
      background-color: #000; overflow: hidden;  
    }  
    #video-container { width: 100%; height: 100%; }  
    video { width: 100%; height: 100%; }  
  </style>  
</head>  
<body>  
  <div data-shaka-player-container id="video-container">  
    <video data-shaka-player id="video" autoplay></video>  
  </div>  
  <script>  
    async function init() {  
      const video = document.getElementById('video');  
      const container = document.getElementById('video-container');  
      const player = new shaka.Player(video);  
      const ui = new shaka.ui.Overlay(player, container, video);  
      
      try {  
        console.log("Fetching stream data...");
        const [resMpd, resKey] = await Promise.all([  
          fetch('/functions/hm', { headers: { "x-app-verify": "CricXCrateSecure2026" } }),  
          fetch('/functions/ok', { headers: { "x-app-verify": "CricXCrateSecure2026" } })  
        ]);  

        if (!resMpd.ok || !resKey.ok) {  
          throw new Error('Failed to fetch from secure endpoints. Status: ' + resMpd.status + ' / ' + resKey.status);  
        }  

        const mpdData = await resMpd.json();  
        const keyData = await resKey.json();  

        console.log("MPD Data received:", mpdData);
        console.log("Key Data received:", keyData);

        const clearKeys = {};  
        const licenseStr = keyData.license || keyData;
        
        if (typeof licenseStr === 'string' && licenseStr.includes(':')) {  
          const parts = licenseStr.split(":");  
          if (parts.length === 2) {  
            clearKeys[parts[0].trim().toLowerCase()] = parts[1].trim().toLowerCase();  
          }  
        }

        console.log("Configured clearKeys:", clearKeys);

        player.configure({  
          drm: {  
            clearKeys: clearKeys  
          }  
        });  

        const streamUrl = mpdData.mpd || mpdData.stream_url;
        console.log("Loading stream URL:", streamUrl);

        await player.load(streamUrl);  
        console.log("Video loaded successfully!");
      } catch (e) {  
        console.error('Error loading video:', e);  
      }  
    }  

    document.addEventListener('DOMContentLoaded', init);
  </script>  
</body>  
</html>
